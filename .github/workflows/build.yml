name: Build desktop apps

on:
  push:
    tags: ['v*']        # git tag v0.1.0 && git push --tags  -> builds + attaches to a GitHub Release
  workflow_dispatch:     # or run manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-build
          path: |
            release/*.AppImage
            release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-files/*
